<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Profile Audit</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-muted: #eef2f4;
      --ink: #172026;
      --muted: #62717c;
      --line: #dbe2e7;
      --teal: #0f766e;
      --blue: #2563eb;
      --amber: #d97706;
      --rose: #dc2626;
      --green: #16803d;
      --shadow: 0 18px 50px rgba(23, 32, 38, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero-main {
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.16;
    }

    h1 {
      max-width: 820px;
      font-size: 30px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .score-panel {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 24px;
      text-align: left;
    }

    .score-number {
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
    }

    .score-label {
      color: var(--muted);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .span-4,
    .span-5,
    .span-6,
    .span-7,
    .span-12 {
      grid-column: auto;
    }

    .content {
      padding: 22px;
    }

    .verdict {
      font-size: 15px;
      color: #26323a;
    }

    .score-list {
      display: grid;
      gap: 10px;
    }

    .score-row {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .score-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .score-name {
      color: var(--ink);
      font-weight: 700;
    }

    .score-value {
      min-width: 56px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e6f3f1;
      color: var(--teal);
      font-weight: 800;
      text-align: center;
    }

    .info-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .info-button:hover,
    .info-button:focus-visible {
      border-color: var(--teal);
      color: var(--teal);
      outline: none;
    }

    .bar-track {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5ebef;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
    }

    .score-detail {
      display: none;
      grid-template-columns: 1fr;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .score-row.is-open .score-detail {
      display: grid;
    }

    .detail-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-text {
      margin: 0;
      color: #26323a;
    }

    .priority-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .priority {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .rank {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      font-weight: 800;
    }

    .priority p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .copy-box {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      white-space: pre-wrap;
    }

    .muted {
      color: var(--muted);
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 900px) {
      h1 { font-size: 26px; }
      .score-panel {
        display: grid;
        gap: 8px;
      }
    }

    @media print {
      body { background: white; }
      .page { max-width: none; padding: 0; }
      .panel { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="panel hero-main">
        <p class="eyebrow">LinkedIn Profile Audit</p>
        <h1 id="reportTitle">Profile Audit</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="panel score-panel">
        <div class="score-number" id="overallScore">--</div>
        <div class="score-label">Overall Score</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel content span-7">
        <h2>Verdict</h2>
        <div class="verdict" id="verdict"></div>
      </div>
      <div class="panel content span-5">
        <h2>Screenshot Coverage</h2>
        <div id="coverage"></div>
      </div>

      <div class="panel content span-6">
        <h2>Dimension Scores</h2>
        <div class="score-list" id="dimensionChart"></div>
      </div>
      <div class="panel content span-6">
        <h2>Section Scores</h2>
        <div class="score-list" id="sectionChart"></div>
      </div>

      <div class="panel content span-12">
        <h2>Top Priorities</h2>
        <ol class="priority-list" id="priorities"></ol>
      </div>

      <div class="panel content span-6">
        <h2>Suggested Headline</h2>
        <div class="copy-box" id="headline"></div>
      </div>
      <div class="panel content span-6">
        <h2>Suggested About Opening</h2>
        <div class="copy-box" id="about"></div>
      </div>

      <div class="panel content span-12">
        <h2>Facts To Confirm</h2>
        <ul id="facts"></ul>
      </div>
    </section>

    <div class="footer">Generated by LI Profile Optimizer Skillset. Review all claims before publishing.</div>
  </main>

  <script>
    const auditData = {
          "profileName": "Mock Profile: Revenue-Focused Founder",
          "targetGoal": "Customer acquisition / sales",
          "primaryReader": "B2B SaaS founders, growth leaders, and sales decision-makers",
          "targetContext": "Fractional growth advisory for seed to Series B SaaS companies",
          "generatedAt": "2026-05-27",
          "confidence": "High",
          "coverage": {
                "type": "Full-page desktop screenshot",
                "visibleSections": [
                      "Intro / Hero",
                      "About",
                      "Featured",
                      "Activity / Posts",
                      "Experience",
                      "Skills",
                      "Education"
                ],
                "missingSections": [
                      "Recommendations"
                ],
                "notes": "The screenshot is readable across the major profile sections. Recommendations are not visible, so social-proof scoring is limited."
          },
          "overallScore": 68,
          "verdict": "The profile has enough credibility for a buyer to keep reading, but the commercial promise is still too indirect. For a sales-led profile, the first screen should make the offer, buyer, and proof point obvious before the visitor scrolls. The strongest next move is to convert broad founder language into a sharper buyer-facing positioning statement and back it with specific outcomes in Featured and Experience.",
          "dimensions": [
                {
                      "name": "Screenshot coverage",
                      "score": 4.5,
                      "evidence": "Most core profile sections are visible in one full-page screenshot.",
                      "risk": "Recommendations and some deeper proof may be missed.",
                      "fix": "Add a second screenshot if recommendations, licenses, or publications matter."
                },
                {
                      "name": "Positioning clarity",
                      "score": 3,
                      "evidence": "The profile communicates seniority and growth experience, but the exact offer is implied.",
                      "risk": "Qualified buyers may not understand when to contact the person.",
                      "fix": "State buyer, problem, offer, and outcome directly in the headline and About opening."
                },
                {
                      "name": "Visual trust and hierarchy",
                      "score": 4,
                      "evidence": "The profile has a professional first impression and a readable visual hierarchy.",
                      "risk": "The banner does not reinforce the growth advisory category.",
                      "fix": "Use a banner with a concise category signal, such as SaaS growth systems or revenue acceleration."
                },
                {
                      "name": "Credibility density",
                      "score": 3.5,
                      "evidence": "Experience supports the claim, but concrete numbers are scattered.",
                      "risk": "The profile asks the buyer to infer impact instead of seeing it immediately.",
                      "fix": "Move 3-5 proof points into About, Featured, and top Experience bullets."
                },
                {
                      "name": "Audience fit",
                      "score": 3,
                      "evidence": "SaaS and growth themes are present, but the ICP is not sharply named.",
                      "risk": "The profile can read like general consulting instead of a clear fit for a specific buyer.",
                      "fix": "Name the target buyer and stage: seed to Series B SaaS founders and growth leaders."
                },
                {
                      "name": "Search discoverability",
                      "score": 3,
                      "evidence": "Relevant terms like growth, SaaS, revenue, and founder appear in visible sections.",
                      "risk": "Important buyer-search terms may not be repeated in high-signal sections.",
                      "fix": "Add natural variants: go-to-market, pipeline, activation, retention, lifecycle, PLG, sales-led growth."
                },
                {
                      "name": "Narrative coherence",
                      "score": 3.5,
                      "evidence": "The career story generally supports the current positioning.",
                      "risk": "The reader may see several capabilities but not one strong commercial lane.",
                      "fix": "Connect past operator experience to the current advisory promise."
                },
                {
                      "name": "Conversion readiness",
                      "score": 2.5,
                      "evidence": "The profile does not make the next step obvious enough for a buyer.",
                      "risk": "Interested visitors may leave without knowing what to ask for.",
                      "fix": "Add a direct CTA in About and use Featured to point to a diagnostic, case study, or booking path."
                },
                {
                      "name": "Content authority",
                      "score": 3,
                      "evidence": "Recent activity is visible, but the topic lane is not consistent enough.",
                      "risk": "Content does not yet compound trust around the sales offer.",
                      "fix": "Publish around 3 recurring themes: pipeline quality, SaaS growth systems, and founder-led sales execution."
                }
          ],
          "sections": [
                {
                      "name": "Intro / Hero",
                      "score": 3,
                      "works": "Professional presence and founder credibility are visible quickly.",
                      "gap": "The headline does not clearly package the offer for a buyer.",
                      "fix": "Rewrite around buyer, problem, outcome, and proof."
                },
                {
                      "name": "About",
                      "score": 3,
                      "works": "The About section gives useful career context.",
                      "gap": "The opening does not lead with a buyer-specific promise.",
                      "fix": "Start with the ICP and the measurable business problem solved."
                },
                {
                      "name": "Featured",
                      "score": 2.5,
                      "works": "There is space to showcase proof assets.",
                      "gap": "Assets do not yet function as a buyer conversion path.",
                      "fix": "Feature a case study, diagnostic, offer page, and one high-trust talk or post."
                },
                {
                      "name": "Activity / Posts",
                      "score": 3,
                      "works": "The profile shows current activity.",
                      "gap": "The posts do not yet form a clear authority lane.",
                      "fix": "Use recurring post formats tied to SaaS growth decisions."
                },
                {
                      "name": "Experience",
                      "score": 3.5,
                      "works": "Roles support founder and growth credibility.",
                      "gap": "Impact bullets are not quantified enough.",
                      "fix": "Add revenue, pipeline, activation, retention, team, or market-scope metrics."
                },
                {
                      "name": "Skills",
                      "score": 3,
                      "works": "Relevant skill terms are visible.",
                      "gap": "The top skills may not match buyer-search language.",
                      "fix": "Prioritize SaaS growth, go-to-market strategy, revenue operations, PLG, and lifecycle marketing."
                },
                {
                      "name": "Recommendations",
                      "score": null,
                      "works": "Unknown from screenshot.",
                      "gap": "Not visible in the provided capture.",
                      "fix": "Add or screenshot recommendations from founders, CEOs, or revenue leaders."
                },
                {
                      "name": "Education / Certifications",
                      "score": 3,
                      "works": "Baseline trust information is present.",
                      "gap": "This section is not central to the sales goal.",
                      "fix": "Keep it concise unless a credential directly increases buyer trust."
                }
          ],
          "priorities": [
                {
                      "title": "Make the offer obvious in the first screen",
                      "detail": "Use the headline to name the buyer, business problem, outcome, and category."
                },
                {
                      "title": "Turn Featured into a proof path",
                      "detail": "Lead with one case study, one diagnostic or offer page, and one credibility asset."
                },
                {
                      "title": "Rewrite the About opening for buyers",
                      "detail": "Start with the commercial problem and the type of company this profile helps."
                },
                {
                      "title": "Quantify operator credibility",
                      "detail": "Add truthful metrics for pipeline, revenue, activation, retention, team size, or company stage."
                },
                {
                      "title": "Create a visible content lane",
                      "detail": "Repeat 3-5 themes so visitors associate the profile with SaaS growth execution."
                }
          ],
          "suggestedHeadline": "I help seed-Series B SaaS founders fix leaky growth systems | GTM, pipeline quality, activation & retention | Ex-[role/company proof]",
          "suggestedAboutOpening": "I work with SaaS founders and growth leaders who need cleaner pipeline, stronger activation, and a more repeatable path from demand to revenue. My work combines operator experience in [stage/category] with hands-on GTM systems across [proof point], [proof point], and [proof point].",
          "factsToConfirm": [
                "Best target buyer and company stage",
                "Strongest revenue or pipeline metric",
                "Most credible customer or case study",
                "Preferred call to action",
                "Proof assets available for Featured",
                "Whether recommendations can be shown publicly"
          ]
    };

    const maxScore = 5;

    function colorForScore(score) {
      if (score === "Unknown" || score == null) return "#8a98a3";
      if (score >= 4) return "var(--green)";
      if (score >= 3) return "var(--teal)";
      if (score >= 2) return "var(--amber)";
      return "var(--rose)";
    }

    function text(value) {
      return value == null || value === "" ? "Unknown" : String(value);
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function scoreText(value) {
      return value == null ? "Unknown" : String(value);
    }

    function renderMeta() {
      const meta = [
        auditData.profileName,
        `Goal: ${auditData.targetGoal}`,
        `Reader: ${auditData.primaryReader}`,
        auditData.targetContext,
        `Confidence: ${auditData.confidence}`,
        auditData.generatedAt
      ].filter(Boolean);
      document.getElementById("meta").innerHTML = meta.map(item => `<span class="chip">${escapeHtml(item)}</span>`).join("");
    }

    function renderScoreList(id, items, type) {
      document.getElementById(id).innerHTML = items.map(item => {
        const score = item.score;
        const width = typeof score === "number" ? Math.max(0, Math.min(100, (score / maxScore) * 100)) : 0;
        const detailId = `${id}-${item.name}`.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
        const detailA = type === "dimension" ? ["Evidence", item.evidence] : ["Works", item.works];
        const detailB = type === "dimension" ? ["Risk", item.risk] : ["Gap", item.gap];
        const detailC = ["Fix", item.fix];
        return `
          <div class="score-row">
            <div class="score-head">
              <div class="score-name">${escapeHtml(item.name)}</div>
              <div class="score-value" style="color:${colorForScore(score)}">${escapeHtml(scoreText(score))}/5</div>
              <button class="info-button" type="button" aria-label="Show notes for ${escapeHtml(item.name)}" aria-expanded="false" aria-controls="${detailId}">?</button>
            </div>
            <div class="bar-track" aria-label="${escapeHtml(item.name)} score ${escapeHtml(scoreText(score))} out of 5">
              <div class="bar-fill" style="width:${width}%; background:${colorForScore(score)}"></div>
            </div>
            <div class="score-detail" id="${detailId}">
              <div>
                <div class="detail-label">${escapeHtml(detailA[0])}</div>
                <p class="detail-text">${escapeHtml(detailA[1])}</p>
              </div>
              <div>
                <div class="detail-label">${escapeHtml(detailB[0])}</div>
                <p class="detail-text">${escapeHtml(detailB[1])}</p>
              </div>
              <div>
                <div class="detail-label">${escapeHtml(detailC[0])}</div>
                <p class="detail-text">${escapeHtml(detailC[1])}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderPriorities() {
      document.getElementById("priorities").innerHTML = auditData.priorities.map((item, index) => `
        <li class="priority">
          <div class="rank">${index + 1}</div>
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.detail)}</p>
          </div>
        </li>
      `).join("");
    }

    function bindScoreDetails() {
      document.querySelectorAll(".info-button").forEach(button => {
        button.addEventListener("click", () => {
          const row = button.closest(".score-row");
          const isOpen = row.classList.toggle("is-open");
          button.setAttribute("aria-expanded", String(isOpen));
        });
      });
    }

    function render() {
      document.getElementById("reportTitle").textContent = `${auditData.profileName || "Profile"} Audit`;
      document.getElementById("overallScore").textContent = auditData.overallScore == null ? "--" : auditData.overallScore;
      document.getElementById("verdict").textContent = text(auditData.verdict);
      renderMeta();

      const coverage = auditData.coverage || {};
      document.getElementById("coverage").innerHTML = `
        <p><strong>Coverage:</strong> ${escapeHtml(coverage.type)}</p>
        <p><strong>Visible:</strong> ${escapeHtml((coverage.visibleSections || []).join(", "))}</p>
        <p><strong>Missing:</strong> ${escapeHtml((coverage.missingSections || []).join(", "))}</p>
        <p class="muted">${escapeHtml(coverage.notes)}</p>
      `;

      renderScoreList("dimensionChart", auditData.dimensions || [], "dimension");
      renderScoreList("sectionChart", auditData.sections || [], "section");
      renderPriorities();
      bindScoreDetails();

      document.getElementById("headline").textContent = text(auditData.suggestedHeadline);
      document.getElementById("about").textContent = text(auditData.suggestedAboutOpening);
      document.getElementById("facts").innerHTML = (auditData.factsToConfirm || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    render();
  </script>
</body>
</html>
