<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Profile Audit</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-muted: #eef2f4;
      --ink: #172026;
      --muted: #62717c;
      --line: #dbe2e7;
      --teal: #0f766e;
      --blue: #2563eb;
      --amber: #d97706;
      --rose: #dc2626;
      --green: #16803d;
      --shadow: 0 18px 50px rgba(23, 32, 38, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero-main {
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.16;
    }

    h1 {
      max-width: 820px;
      font-size: 30px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .score-panel {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 24px;
      text-align: left;
    }

    .score-number {
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
    }

    .score-label {
      color: var(--muted);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .span-4,
    .span-5,
    .span-6,
    .span-7,
    .span-12 {
      grid-column: auto;
    }

    .content {
      padding: 22px;
    }

    .verdict {
      font-size: 15px;
      color: #26323a;
    }

    .score-list {
      display: grid;
      gap: 10px;
    }

    .score-row {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .score-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .score-name {
      color: var(--ink);
      font-weight: 700;
    }

    .score-value {
      min-width: 56px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e6f3f1;
      color: var(--teal);
      font-weight: 800;
      text-align: center;
    }

    .info-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .info-button:hover,
    .info-button:focus-visible {
      border-color: var(--teal);
      color: var(--teal);
      outline: none;
    }

    .bar-track {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5ebef;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
    }

    .score-detail {
      display: none;
      grid-template-columns: 1fr;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .score-row.is-open .score-detail {
      display: grid;
    }

    .detail-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-text {
      margin: 0;
      color: #26323a;
    }

    .priority-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .priority {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .rank {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      font-weight: 800;
    }

    .priority p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .copy-box {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      white-space: pre-wrap;
    }

    .muted {
      color: var(--muted);
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 900px) {
      h1 { font-size: 26px; }
      .score-panel {
        display: grid;
        gap: 8px;
      }
    }

    @media print {
      body { background: white; }
      .page { max-width: none; padding: 0; }
      .panel { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="panel hero-main">
        <p class="eyebrow">LinkedIn Profile Audit</p>
        <h1 id="reportTitle">Profile Audit</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="panel score-panel">
        <div class="score-number" id="overallScore">--</div>
        <div class="score-label">Overall Score</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel content span-7">
        <h2>Verdict</h2>
        <div class="verdict" id="verdict"></div>
      </div>
      <div class="panel content span-5">
        <h2>Screenshot Coverage</h2>
        <div id="coverage"></div>
      </div>

      <div class="panel content span-6">
        <h2>Dimension Scores</h2>
        <div class="score-list" id="dimensionChart"></div>
      </div>
      <div class="panel content span-6">
        <h2>Section Scores</h2>
        <div class="score-list" id="sectionChart"></div>
      </div>

      <div class="panel content span-12">
        <h2>Top Priorities</h2>
        <ol class="priority-list" id="priorities"></ol>
      </div>

      <div class="panel content span-6">
        <h2>Suggested Headline</h2>
        <div class="copy-box" id="headline"></div>
      </div>
      <div class="panel content span-6">
        <h2>Suggested About Opening</h2>
        <div class="copy-box" id="about"></div>
      </div>

      <div class="panel content span-12">
        <h2>Facts To Confirm</h2>
        <ul id="facts"></ul>
      </div>
    </section>

    <div class="footer">Generated by LinkedIn Profile Analyzer. Review all claims before publishing.</div>
  </main>

  <script>
    const auditData = {
      profileName: "Example Profile",
      targetGoal: "Senior product leadership search",
      primaryReader: "Hiring managers and executive recruiters",
      targetContext: "Senior product leadership roles in B2B SaaS",
      generatedAt: "2026-05-27",
      confidence: "High",
      coverage: {
        type: "Full-page screenshot",
        visibleSections: ["Intro / Hero", "About", "Featured", "Activity", "Experience", "Skills"],
        missingSections: ["Recommendations"],
        notes: "Text is readable and major sections are visible."
      },
      overallScore: 72,
      verdict: "The profile has a credible foundation, but the first-screen positioning and proof density need tightening. The fastest improvement is to make the headline and About opening more specific, then move stronger proof into Featured.",
      dimensions: [
        { name: "Positioning", score: 3.5, evidence: "Headline states role but not audience or proof.", risk: "Recruiters may not understand seniority quickly.", fix: "Rewrite headline around role + category + proof." },
        { name: "Visual Trust", score: 4, evidence: "Clean photo and readable hero area.", risk: "Banner is generic.", fix: "Use a banner that reinforces product leadership or domain focus." },
        { name: "Credibility", score: 3, evidence: "Experience is visible but outcomes are light.", risk: "Claims feel under-evidenced.", fix: "Add metrics, team scope, product scale, or business outcomes." },
        { name: "Discoverability", score: 3, evidence: "Some role keywords are present.", risk: "Search fit may be broad.", fix: "Add target-role keywords naturally in headline, About, and Experience." },
        { name: "Content Authority", score: 2.5, evidence: "Activity is visible but themes are not obvious.", risk: "Expertise is not reinforced by recent content.", fix: "Use 3-5 recurring content pillars." }
      ],
      sections: [
        { name: "Intro / Hero", score: 3.5, works: "Clear current role and readable first screen.", gap: "Headline lacks proof.", fix: "Add category and outcome language." },
        { name: "About", score: 3, works: "Professional narrative is present.", gap: "Opening is generic.", fix: "Lead with audience, domain, and proof." },
        { name: "Featured", score: 2, works: "Section exists.", gap: "Proof assets are weak or unclear.", fix: "Feature case studies, talks, product demos, or portfolio proof." },
        { name: "Activity / Posts", score: 2.5, works: "Recent activity is visible.", gap: "Topic lane is not clear.", fix: "Post around recurring product leadership themes." },
        { name: "Experience", score: 3, works: "Relevant roles are visible.", gap: "Impact and scope are under-specified.", fix: "Convert responsibilities into outcomes." },
        { name: "Skills", score: 3.5, works: "Relevant skills are present.", gap: "Top skills may not match target role enough.", fix: "Reorder around target search terms." }
      ],
      priorities: [
        { title: "Rewrite the headline", detail: "Make role, category, and proof visible in the first screen." },
        { title: "Strengthen About opening", detail: "Use the first lines to state who you help, what you lead, and what evidence supports it." },
        { title: "Upgrade Featured proof", detail: "Add 2-4 assets that prove product leadership: case studies, talks, demos, or portfolio pages." },
        { title: "Quantify Experience", detail: "Add team scope, product scale, revenue, adoption, or operational impact where truthful." }
      ],
      suggestedHeadline: "Product leader for [category] | Led [product/team/scope] to [measurable outcome] | [domain] strategy & execution",
      suggestedAboutOpening: "I lead product teams building [category/product] for [audience]. My work focuses on turning [complex problem] into measurable product and business outcomes, including [metric/proof point].",
      factsToConfirm: ["Team size", "Product scale or user count", "Revenue/adoption impact", "Most relevant target role", "Best proof assets for Featured"]
    };

    const maxScore = 5;

    function colorForScore(score) {
      if (score === "Unknown" || score == null) return "#8a98a3";
      if (score >= 4) return "var(--green)";
      if (score >= 3) return "var(--teal)";
      if (score >= 2) return "var(--amber)";
      return "var(--rose)";
    }

    function text(value) {
      return value == null || value === "" ? "Unknown" : String(value);
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function scoreText(value) {
      return value == null ? "Unknown" : String(value);
    }

    function renderMeta() {
      const meta = [
        auditData.profileName,
        `Goal: ${auditData.targetGoal}`,
        `Reader: ${auditData.primaryReader}`,
        auditData.targetContext,
        `Confidence: ${auditData.confidence}`,
        auditData.generatedAt
      ].filter(Boolean);
      document.getElementById("meta").innerHTML = meta.map(item => `<span class="chip">${escapeHtml(item)}</span>`).join("");
    }

    function renderScoreList(id, items, type) {
      document.getElementById(id).innerHTML = items.map(item => {
        const score = item.score;
        const width = typeof score === "number" ? Math.max(0, Math.min(100, (score / maxScore) * 100)) : 0;
        const detailId = `${id}-${item.name}`.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
        const detailA = type === "dimension" ? ["Evidence", item.evidence] : ["Works", item.works];
        const detailB = type === "dimension" ? ["Risk", item.risk] : ["Gap", item.gap];
        const detailC = ["Fix", item.fix];
        return `
          <div class="score-row">
            <div class="score-head">
              <div class="score-name">${escapeHtml(item.name)}</div>
              <div class="score-value" style="color:${colorForScore(score)}">${escapeHtml(scoreText(score))}/5</div>
              <button class="info-button" type="button" aria-label="Show notes for ${escapeHtml(item.name)}" aria-expanded="false" aria-controls="${detailId}">?</button>
            </div>
            <div class="bar-track" aria-label="${escapeHtml(item.name)} score ${escapeHtml(scoreText(score))} out of 5">
              <div class="bar-fill" style="width:${width}%; background:${colorForScore(score)}"></div>
            </div>
            <div class="score-detail" id="${detailId}">
              <div>
                <div class="detail-label">${escapeHtml(detailA[0])}</div>
                <p class="detail-text">${escapeHtml(detailA[1])}</p>
              </div>
              <div>
                <div class="detail-label">${escapeHtml(detailB[0])}</div>
                <p class="detail-text">${escapeHtml(detailB[1])}</p>
              </div>
              <div>
                <div class="detail-label">${escapeHtml(detailC[0])}</div>
                <p class="detail-text">${escapeHtml(detailC[1])}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderPriorities() {
      document.getElementById("priorities").innerHTML = auditData.priorities.map((item, index) => `
        <li class="priority">
          <div class="rank">${index + 1}</div>
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.detail)}</p>
          </div>
        </li>
      `).join("");
    }

    function bindScoreDetails() {
      document.querySelectorAll(".info-button").forEach(button => {
        button.addEventListener("click", () => {
          const row = button.closest(".score-row");
          const isOpen = row.classList.toggle("is-open");
          button.setAttribute("aria-expanded", String(isOpen));
        });
      });
    }

    function render() {
      document.getElementById("reportTitle").textContent = `${auditData.profileName || "Profile"} Audit`;
      document.getElementById("overallScore").textContent = auditData.overallScore == null ? "--" : auditData.overallScore;
      document.getElementById("verdict").textContent = text(auditData.verdict);
      renderMeta();

      const coverage = auditData.coverage || {};
      document.getElementById("coverage").innerHTML = `
        <p><strong>Coverage:</strong> ${escapeHtml(coverage.type)}</p>
        <p><strong>Visible:</strong> ${escapeHtml((coverage.visibleSections || []).join(", "))}</p>
        <p><strong>Missing:</strong> ${escapeHtml((coverage.missingSections || []).join(", "))}</p>
        <p class="muted">${escapeHtml(coverage.notes)}</p>
      `;

      renderScoreList("dimensionChart", auditData.dimensions || [], "dimension");
      renderScoreList("sectionChart", auditData.sections || [], "section");
      renderPriorities();
      bindScoreDetails();

      document.getElementById("headline").textContent = text(auditData.suggestedHeadline);
      document.getElementById("about").textContent = text(auditData.suggestedAboutOpening);
      document.getElementById("facts").innerHTML = (auditData.factsToConfirm || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    render();
  </script>
</body>
</html>
